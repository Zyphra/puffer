[project]
name = "puffer-dedup"
version = "0.1.0"
description = "PUFFER: incremental MinHash-LSH deduplication with an exact-membership band-key index, streaming tiered compaction, and provenance-based dataset withdrawal"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Zyphra" }]
dependencies = [
    "numpy>=1.26",
    "polars>=1.0",
    "pyarrow>=16",
    "xxhash>=3.4",
    "rensa>=0.2",
    "pybloom-live>=4.0",
]

[project.optional-dependencies]
ray = ["ray>=2.9"]
dev = ["pytest>=8", "pytest-timeout>=2"]

[project.scripts]
puffer = "puffer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/puffer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600
